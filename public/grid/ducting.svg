<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#063353"/>
    </linearGradient>
    <linearGradient id="duct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.5" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="ductV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="0.5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <!-- Ceiling void -->
  <rect width="800" height="330" fill="url(#bg)"/>
  <!-- Slab and hangers -->
  <rect width="800" height="34" fill="#334155"/>
  <path d="M120 34 V120 M300 34 V120 M500 34 V120 M680 34 V120" stroke="#94A3B8" stroke-width="4"/>

  <!-- Main supply duct -->
  <rect x="30" y="110" width="740" height="80" rx="6" fill="url(#duct)" stroke="#F8FAFC" stroke-width="2"/>
  <path d="M170 110 V190 M310 110 V190 M450 110 V190 M590 110 V190" stroke="#64748B" stroke-width="3"/>
  <!-- Airflow arrow in duct -->
  <path d="M60 150 H200 M180 135 L200 150 L180 165" stroke="#0284C7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- VAV box -->
  <rect x="350" y="190" width="40" height="25" fill="url(#ductV)"/>
  <rect x="300" y="215" width="210" height="80" rx="8" fill="#16263A" stroke="#38BDF8" stroke-width="3"/>
  <text x="380" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#7DD3FC">VAV</text>
  <!-- Controller -->
  <rect x="450" y="230" width="44" height="50" rx="6" fill="#0F172A" stroke="#7DD3FC" stroke-width="2"/>
  <circle cx="472" cy="248" r="7" fill="#22C55E"/>
  <path d="M460 266 H484" stroke="#7DD3FC" stroke-width="3"/>

  <!-- Branch ducts down to diffusers -->
  <rect x="97" y="190" width="46" height="140" fill="url(#ductV)"/>
  <rect x="357" y="295" width="46" height="35" fill="url(#ductV)"/>
  <rect x="657" y="190" width="46" height="140" fill="url(#ductV)"/>

  <!-- Ceiling line -->
  <rect y="330" width="800" height="18" fill="#F8FAFC"/>
  <!-- Diffusers -->
  <g fill="#E2E8F0" stroke="#94A3B8" stroke-width="2">
    <rect x="76" y="344" width="88" height="16" rx="3"/>
    <rect x="336" y="344" width="88" height="16" rx="3"/>
    <rect x="636" y="344" width="88" height="16" rx="3"/>
  </g>

  <!-- Room below -->
  <rect y="360" width="800" height="240" fill="url(#room)"/>
  <rect y="540" width="800" height="60" fill="#94A3B8"/>

  <!-- Cool airflow -->
  <g stroke="#0EA5E9" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M100 375 q-14 40 -4 80 M120 375 v90 M140 375 q14 40 4 80"/>
    <path d="M360 375 q-14 40 -4 80 M380 375 v90 M400 375 q14 40 4 80"/>
    <path d="M660 375 q-14 40 -4 80 M680 375 v90 M700 375 q14 40 4 80"/>
  </g>

  <!-- Thermostat on wall -->
  <rect x="540" y="430" width="56" height="70" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/>
  <text x="568" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0284C7">22°</text>
</svg>
